# config/qmt.toml

[paths]
root = "~/.qmt-agent-trader"
workspace = "workspace"
state = ".qmt"

[models.main]
name = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_secret = "DEEPSEEK_API_KEY"
context_window_tokens = 1000000
reasoning_effort = "max"

[models.title]
name = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_secret = "DEEPSEEK_API_KEY"
reasoning_effort = "none"

[models.activity]
name = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_secret = "DEEPSEEK_API_KEY"
reasoning_effort = "none"

[models.bootstrap]
name = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_secret = "DEEPSEEK_API_KEY"
reasoning_effort = "none"

[activity]
max_user_message_chars = 2000
max_reasoning_chars = 3000
max_argument_chars = 2000
max_label_chars = 120

[tui]
sidebar_width = 30
sidebar_min_width = 20
composer_height = 7
activity_panel_max_height = 8
activity_detail_max_height = 12
approval_arguments_max_height = 12
message_author_margin_top = 3
message_author_margin_bottom = 2
run_timer_interval_seconds = 1.0

[observability]
sdk_tracing_enabled = false

[logging]
level = "INFO"
max_bytes = 10485760
backup_count = 5

[runtime]
default_timezone = "Asia/Shanghai"
max_turns = 100

[backtest]
use_cnequity = false
rqalpha_bundle_dir = ".rqalpha/bundle"
artifact_dir = "backtests"
default_initial_cash = 1000000.0
inspect_max_symbols = 50
stock_t1 = true
dividend_reinvestment = false
dividend_tax_enabled = true
capital_gain_tax_rate = 0.0
validate_price = true
matching_type = "current_bar"
price_limit = true
volume_limit = true
inactive_limit = true
slippage_model = "PriceRatioSlippage"
slippage = 0.0
stock_min_commission = 5.0
stock_commission_multiplier = 1.0
tax_multiplier = 1.0
pit_tax = true

[execution]
default_timeout_seconds = 30
max_timeout_seconds = 300
background_job_dir = ".qmt-processes"

[explore]
max_full_read_bytes = 65536
max_read_chars = 65536
max_search_results = 50
max_search_snippet_chars = 300

[calculate]
max_expression_chars = 1000
max_nodes = 100
max_integer_bits = 4096
max_abs_exponent = 10000

[mcp]
default_timeout_seconds = 5.0
drop_failed_servers = true
include_server_in_tool_names = true

[cnequity]
config_path = "configs/cnequity.toml"
mcp_cache_tools_list = true

[[bootstrap.files]]
source = "MEMORY.md.template"
target = "MEMORY.md"

[[bootstrap.files]]
source = "configuration.md.template"
target = "memory/configuration.md"

[[bootstrap.files]]
source = "rqalpha.md.template"
target = "memory/rqalpha.md"
