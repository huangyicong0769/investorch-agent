# config/qmt.toml

[paths]
root = "~/.qmt-agent-trader"
workspace = "workspace"
state = ".qmt"

[model]
name = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"

[observability]
summary_enabled = true
summary_threshold = 1000
sdk_tracing_enabled = false

[runtime]
default_timezone = "Asia/Shanghai"
max_turns = 100

[backtest]
use_cnequity = false
rqalpha_bundle_dir = ".rqalpha/bundle"
artifact_dir = "backtests"
default_initial_cash = 1000000.0
inspect_max_symbols = 50
stock_t1 = true
dividend_reinvestment = false
dividend_tax_enabled = true
capital_gain_tax_rate = 0.0
validate_price = true
matching_type = "current_bar"
price_limit = true
volume_limit = true
inactive_limit = true
slippage_model = "PriceRatioSlippage"
slippage = 0.0
stock_min_commission = 5.0
stock_commission_multiplier = 1.0
tax_multiplier = 1.0
pit_tax = true

[execution]
default_timeout_seconds = 30
max_timeout_seconds = 300
background_job_dir = ".qmt-processes"

[explore]
max_full_read_bytes = 65536
max_read_chars = 65536
max_search_results = 50
max_search_snippet_chars = 300

[calculate]
max_expression_chars = 1000
max_nodes = 100
max_integer_bits = 4096
max_abs_exponent = 10000

[mcp]
default_timeout_seconds = 5.0
drop_failed_servers = true
include_server_in_tool_names = true

[cnequity]
config_path = "configs/cnequity.toml"
mcp_cache_tools_list = true

[[bootstrap.files]]
source = "MEMORY.md.template"
target = "MEMORY.md"

[[bootstrap.files]]
source = "configuration.md.template"
target = "memory/configuration.md"

[[bootstrap.files]]
source = "rqalpha.md.template"
target = "memory/rqalpha.md"
