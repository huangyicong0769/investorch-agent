# config/qmt.toml

[paths]
root = "~/.qmt-agent-trader"
workspace = "workspace"
state = ".qmt"

[model]
name = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"

[observability]
summary_enabled = true

[[bootstrap.files]]
source = "MEMORY.md.template"
target = "MEMORY.md"

[[bootstrap.files]]
source = "configuration.md.template"
target = "memory/configuration.md"