# config/qmt.toml

[paths]
root = "~/.qmt-agent-trader"
data = "data"
workspace = "workspace"
state = ".qmt"

[model]
name = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"

[observability]
summary_enabled = true
summary_threshold = 1000

[runtime]
default_timezone = "Asia/Shanghai"

[execution]
default_timeout_seconds = 30
max_timeout_seconds = 300
background_job_dir = ".qmt-processes"
background_job_id_chars = 12
background_log_chunk_bytes = 65536
background_log_max_bytes = 16777216
background_log_retained_bytes = 8388608
background_output_tail_chars = 16384
background_status_timeout_seconds = 2
background_stop_timeout_seconds = 2
durable_job_dir = "background-jobs"

[explore]
max_full_read_bytes = 65536
max_read_chars = 65536
max_search_results = 50
max_search_snippet_chars = 300

[calculate]
max_expression_chars = 1000
max_nodes = 100
max_integer_bits = 4096
max_abs_exponent = 10000

[mcp]
default_timeout_seconds = 5.0

[[bootstrap.files]]
source = "MEMORY.md.template"
target = "MEMORY.md"

[[bootstrap.files]]
source = "configuration.md.template"
target = "memory/configuration.md"

[[bootstrap.files]]
source = "curated-data.md.template"
target = "memory/curated-data.md"
