[project]
name = "investorch-qmt"
version = "0.1.0"
description = "InvestOrch QMT integration companion MCP server"
readme = "README.md"
authors = [{ name = "InvestOrch contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
keywords = ["investment", "mcp", "qmt", "windows"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=2.1.1,<3",
    "mcp-types>=2.1.1,<3",
    "platformdirs>=4,<5",
    "starlette>=0.48,<1",
    "tomlkit>=0.15.1,<0.16",
    "uvicorn>=0.52.4,<0.53",
]

[project.urls]
Homepage = "https://github.com/huangyicong0769/investorch-agent"
Issues = "https://github.com/huangyicong0769/investorch-agent/issues"
Repository = "https://github.com/huangyicong0769/investorch-agent.git"

[project.scripts]
investorch-qmt = "investorch_qmt.cli:entrypoint"

[build-system]
requires = ["uv_build==0.12.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "investorch_qmt"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
preview = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "httpx2>=2.5,<3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
