[project]
name = "qmt-agent-trader"
version = "0.1.0"
description = "Local human-supervised quantitative trading agent with Web, TUI, and plain-console clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cnequity==0.7.3",
    "fastapi>=0.141.1",
    "openai-agents>=0.22.0",
    "rqalpha==6.3.0",
    "socksio==1.*",
    "textual==8.2.8",
    "tomlkit>=0.15.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
qmt-agent = "qmt_agent.__main__:entrypoint"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qmt_agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
