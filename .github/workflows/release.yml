name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerelease:
    name: Build draft prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate tag and release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project python scripts/check_release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Require tagged commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "The tagged commit is not contained in origin/main."
            exit 1
          fi

      - name: Sync locked Python environment
        run: uv sync --locked --dev

      - name: Check Python formatting
        run: uv run --locked ruff format --check .

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Run behavioral tests
        run: uv run --locked pytest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build production WebUI
        working-directory: frontend
        run: npm run build

      - name: Verify committed production bundle
        shell: bash
        run: |
          if ! git diff --quiet -- src/investorch/web/static ||
             [ -n "$(git ls-files --others --exclude-standard -- src/investorch/web/static)" ]; then
            echo "Bundled WebUI is out of date. Run: cd frontend && npm run build"
            git status --short -- src/investorch/web/static
            git diff -- src/investorch/web/static
            exit 1
          fi

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test core and CNEquity wheel and source installations
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cp scripts/package_smoke.py "$smoke_dir/"
          wheel=("$GITHUB_WORKSPACE"/dist/*.whl)
          sdist=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          test "${#wheel[@]}" -eq 1
          test "${#sdist[@]}" -eq 1
          cd "$smoke_dir"
          for distribution in "${wheel[0]}" "${sdist[0]}"; do
            uv run --isolated --no-project --with "$distribution" python package_smoke.py
            uv run --isolated --no-project --with "$distribution[cnequity]" \
              python package_smoke.py --expect-cnequity
          done

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum ./*.whl ./*.tar.gz > SHA256SUMS

      - name: Install pinned GitHub CLI
        env:
          GH_CLI_SHA256: fdd768eb70f6409f80fcfa9f3a1c0adf0fc98d827ab3ce0bed2ac22762c5d786
          GH_CLI_VERSION: 2.103.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          echo "$GH_CLI_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Verify GitHub CLI version
        run: test "$(gh --version | head -n 1 | cut -d ' ' -f 3)" = "2.103.0"

      - name: Create or update draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_record="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft] | @tsv" |
              head -n 1
          )"

          if [ -n "$release_record" ]; then
            IFS=$'\t' read -r release_id is_draft <<< "$release_record"
            if [ "$is_draft" != "true" ]; then
              echo "Release $RELEASE_TAG already exists and is not a draft; refusing to modify it."
              exit 1
            fi
            echo "Updating draft release ID $release_id."
            gh release edit "$RELEASE_TAG" \
              --draft \
              --prerelease \
              --title "InvestOrch Agent $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES" \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --prerelease \
              --title "InvestOrch Agent $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES" \
              --verify-tag
          fi

          gh release upload "$RELEASE_TAG" \
            dist/investorch-"$RELEASE_VERSION"-py3-none-any.whl \
            dist/investorch-"$RELEASE_VERSION".tar.gz \
            dist/SHA256SUMS \
            --clobber
