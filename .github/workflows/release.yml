name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerelease:
    name: Build draft prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate tag and release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project python scripts/check_release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Require tagged commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "The tagged commit is not contained in origin/main."
            exit 1
          fi

      - name: Sync locked Python environment
        run: uv sync --locked --dev

      - name: Check Python formatting
        run: uv run --locked ruff format --check .

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Run behavioral tests
        run: uv run --locked pytest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build production WebUI
        working-directory: frontend
        run: npm run build

      - name: Verify committed production bundle
        shell: bash
        run: |
          if ! git diff --quiet -- src/investorch/web/static ||
             [ -n "$(git ls-files --others --exclude-standard -- src/investorch/web/static)" ]; then
            echo "Bundled WebUI is out of date. Run: cd frontend && npm run build"
            git status --short -- src/investorch/web/static
            git diff -- src/investorch/web/static
            exit 1
          fi

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cp scripts/package_smoke.py "$smoke_dir/"
          wheel=("$GITHUB_WORKSPACE"/dist/*.whl)
          sdist=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          test "${#wheel[@]}" -eq 1
          test "${#sdist[@]}" -eq 1
          cd "$smoke_dir"
          uv run --isolated --no-project --with "${wheel[0]}" python package_smoke.py
          uv run --isolated --no-project --with "${sdist[0]}" python package_smoke.py

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum ./*.whl ./*.tar.gz > SHA256SUMS

      - name: Create or update draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_record="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft] | @tsv" |
              head -n 1
          )"

          if [ -n "$release_record" ]; then
            IFS=$'\t' read -r release_id is_draft <<< "$release_record"
            if [ "$is_draft" != "true" ]; then
              echo "Release $RELEASE_TAG already exists and is not a draft; refusing to modify it."
              exit 1
            fi
            echo "Updating draft release ID $release_id."
            gh release edit "$RELEASE_TAG" \
              --draft \
              --prerelease \
              --title "InvestOrch Agent $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES" \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --prerelease \
              --title "InvestOrch Agent $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES" \
              --verify-tag
          fi

          gh release upload "$RELEASE_TAG" \
            dist/investorch-"$RELEASE_VERSION"-py3-none-any.whl \
            dist/investorch-"$RELEASE_VERSION".tar.gz \
            dist/SHA256SUMS \
            --clobber
