name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --dev
      - name: Sync QMT companion integration environment
        run: uv sync --project packages/investorch-qmt --locked --dev
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Run behavioral tests
        run: uv run --locked pytest

  frontend:
    name: Frontend / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build production WebUI
        working-directory: frontend
        run: npm run build
      - name: Verify committed production bundle
        shell: bash
        run: |
          if ! git diff --quiet -- src/investorch/web/static ||
             [ -n "$(git ls-files --others --exclude-standard -- src/investorch/web/static)" ]; then
            echo "Bundled WebUI is out of date. Run: cd frontend && npm run build"
            git status --short -- src/investorch/web/static
            git diff -- src/investorch/web/static
            exit 1
          fi

  package:
    name: Package / Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          enable-cache: true
      - name: Build distributions
        run: uv build --no-sources
      - name: Smoke test wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cp scripts/package_smoke.py "$smoke_dir/"
          wheel=("$GITHUB_WORKSPACE"/dist/*.whl)
          sdist=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          test "${#wheel[@]}" -eq 1
          test "${#sdist[@]}" -eq 1
          cd "$smoke_dir"
          uv run --isolated --no-project --with "${wheel[0]}" python package_smoke.py
          uv run --isolated --no-project --with "${sdist[0]}" python package_smoke.py

  qmt:
    name: QMT Companion / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/investorch-qmt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: packages/investorch-qmt/.python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --dev
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Run companion tests
        run: uv run --locked pytest
      - name: Build companion distributions
        run: uv build --no-sources
      - name: Smoke test companion wheel and source distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheel = @(Get-ChildItem dist -Filter *.whl)
          $sdist = @(Get-ChildItem dist -Filter *.tar.gz)
          if ($wheel.Count -ne 1 -or $sdist.Count -ne 1) {
            throw "Expected one wheel and one source distribution"
          }
          foreach ($artifact in @($wheel[0], $sdist[0])) {
            $smokeDir = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString("N"))
            New-Item -ItemType Directory -Path $smokeDir | Out-Null
            Copy-Item scripts/package_smoke.py $smokeDir
            Push-Location $smokeDir
            try {
              uv run --isolated --no-project --with $artifact.FullName python package_smoke.py
              if ($LASTEXITCODE -ne 0) {
                throw "Companion artifact smoke failed with exit code $LASTEXITCODE"
              }
            } finally {
              Pop-Location
              Remove-Item -Recurse -Force $smokeDir
            }
          }
      - name: Upload companion distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: investorch-qmt-${{ github.sha }}
          path: packages/investorch-qmt/dist/*
          if-no-files-found: error

  gate:
    name: CI / Gate
    if: always()
    needs:
      - python
      - frontend
      - package
      - qmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful quality gates
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          QMT_RESULT: ${{ needs.qmt.result }}
        run: |
          test "$PYTHON_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$QMT_RESULT" = "success"
