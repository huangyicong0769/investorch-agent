name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --dev
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Run behavioral tests
        run: uv run --locked pytest

  frontend:
    name: Frontend / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build production WebUI
        working-directory: frontend
        run: npm run build
      - name: Verify committed production bundle
        shell: bash
        run: |
          if ! git diff --quiet -- src/investorch/web/static ||
             [ -n "$(git ls-files --others --exclude-standard -- src/investorch/web/static)" ]; then
            echo "Bundled WebUI is out of date. Run: cd frontend && npm run build"
            git status --short -- src/investorch/web/static
            git diff -- src/investorch/web/static
            exit 1
          fi

  package:
    name: Package / ${{ matrix.installation }}
    strategy:
      fail-fast: false
      matrix:
        installation: [core, cnequity]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Build distributions
        run: uv build --no-sources
      - name: Smoke test wheel and source distribution
        env:
          INSTALLATION: ${{ matrix.installation }}
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cp scripts/package_smoke.py "$smoke_dir/"
          wheel=("$GITHUB_WORKSPACE"/dist/*.whl)
          sdist=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          test "${#wheel[@]}" -eq 1
          test "${#sdist[@]}" -eq 1
          smoke_args=()
          if [ "$INSTALLATION" = "cnequity" ]; then
            wheel[0]="${wheel[0]}[cnequity]"
            sdist[0]="${sdist[0]}[cnequity]"
            smoke_args+=(--expect-cnequity)
          fi
          cd "$smoke_dir"
          uv run --isolated --no-project --with "${wheel[0]}" python package_smoke.py "${smoke_args[@]}"
          uv run --isolated --no-project --with "${sdist[0]}" python package_smoke.py "${smoke_args[@]}"

  gate:
    name: CI / Gate
    if: always()
    needs:
      - python
      - frontend
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful quality gates
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$PYTHON_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
